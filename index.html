<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>珠寶源 JES | 自動化珠寶業務，從原料到銷售的極致效能</title>
    <meta name="description" content="專為珠寶業設計的 JES 系統，協助您在 30 天內實現數據驅動的管理，消除流程混亂與金屬損耗。" />
    <!-- Luxury & Professional Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Noto+Serif+TC:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('jes-theme');
          if (savedTheme && savedTheme !== 'pearl-minimalist') {
            document.documentElement.setAttribute('data-theme', savedTheme);
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
